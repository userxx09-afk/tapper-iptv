name: Build Fire TV APK

# Produces an installable APK as a downloadable artifact. Runs on GitHub's
# runners, which have the Android SDK preinstalled and unrestricted access to
# Google's Maven repo.

on:
  push:
    branches: [main]
  workflow_dispatch:      # trigger by hand from the Actions tab
  release:
    types: [created]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # setup-gradle provides Gradle itself, so the repo doesn't need the
      # gradle-wrapper.jar binary committed. Run `gradle wrapper` locally once
      # if you'd rather have ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :firetv:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp firetv/build/outputs/apk/debug/*.apk dist/tapper-iptv-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tapper-iptv-apk
          path: dist/*.apk
          retention-days: 30

      # Tagging a commit publishes the APK at a stable URL you can paste into
      # the Downloader app on the Fire TV.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
